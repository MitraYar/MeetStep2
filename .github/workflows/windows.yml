name: Windows standalone
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: pip install -r requirements.txt pyinstaller==6.11.1
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --onefile --windowed --name MeetStep --add-data "led_packets.json;." --hidden-import mido.backends.rtmidi app.py
      - uses: actions/upload-artifact@v4
        with:
          name: MeetStep-Windows-x64
          path: dist/MeetStep.exe
